name = "danfe-cleaning"
main = "src/danfe-worker.ts"
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domains are activated only on an explicit deployment, after the
# danfecleaning.com zone and ownership have been confirmed in Cloudflare.
routes = [
  { pattern = "www.danfecleaning.com", custom_domain = true },
  { pattern = "danfecleaning.com", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1

[env.production]
name = "danfe-cleaning"
workers_dev = true
routes = [
  { pattern = "www.danfecleaning.com", custom_domain = true },
  { pattern = "danfecleaning.com", custom_domain = true }
]
vars = { API_BASE_URL = "https://api.servbazaar.com" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "serviceos-production"
database_id = "01882e3d-806f-4fe2-a163-9dcee6fd0297"
