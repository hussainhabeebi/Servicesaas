name = "serviceos-app"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "BOOKING_CALENDAR"
class_name = "BookingCalendarDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BookingCalendarDO"]

# --- Staging -----------------------------------------------------------
[env.staging]
name = "serviceos-app-staging"
vars = { ENVIRONMENT = "staging", ROOT_DOMAIN = "stg.servbazaar.com", CHATWOOT_BASE_URL = "https://app.aiingo.com", CHATWOOT_AGENT_BOT_ID = "REPLACE_WITH_CHATWOOT_AGENT_BOT_ID", META_APP_ID = "REPLACE_WITH_META_APP_ID", META_EMBEDDED_SIGNUP_CONFIG_ID = "REPLACE_WITH_META_EMBEDDED_SIGNUP_CONFIG_ID", GEMINI_MODEL = "gemini-2.0-flash" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "serviceos-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "serviceos-staging-files"

[[env.staging.durable_objects.bindings]]
name = "BOOKING_CALENDAR"
class_name = "BookingCalendarDO"

# 20:00 UTC = 00:00 Asia/Dubai — rolls each active tenant's day into daily_stats
[env.staging.triggers]
crons = ["0 20 * * *"]

# --- Production ----------------------------------------------------------
[env.production]
name = "serviceos-app-production"
vars = { ENVIRONMENT = "production", ROOT_DOMAIN = "servbazaar.com", CHATWOOT_BASE_URL = "https://app.aiingo.com", CHATWOOT_AGENT_BOT_ID = "REPLACE_WITH_CHATWOOT_AGENT_BOT_ID", META_APP_ID = "REPLACE_WITH_META_APP_ID", META_EMBEDDED_SIGNUP_CONFIG_ID = "REPLACE_WITH_META_EMBEDDED_SIGNUP_CONFIG_ID", GEMINI_MODEL = "gemini-2.0-flash" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "serviceos-production"
database_id = "01882e3d-806f-4fe2-a163-9dcee6fd0297"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "serviceos-production-files"

[[env.production.durable_objects.bindings]]
name = "BOOKING_CALENDAR"
class_name = "BookingCalendarDO"

[env.production.triggers]
crons = ["0 20 * * *"]

# Secrets (JWT_SECRET, CHATWOOT_PLATFORM_API_TOKEN, CHATWOOT_AGENT_BOT_TOKEN,
# CHATWOOT_WEBHOOK_TOKEN, GEMINI_API_KEY, RAZORPAY_*, PHONEPE_*, TELR_*,
# NETWORK_INTL_*, CF_API_TOKEN, CF_ZONE_ID, ADMIN_API_TOKEN) are set
# per-environment via `wrangler secret put <NAME> --env <staging|production>`,
# never committed here.
